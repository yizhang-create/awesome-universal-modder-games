name: CI

on:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['data/**', 'scripts/**', '.github/workflows/ci.yml']

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-data.mjs
